spring.application.name=demo
server.port=8080

# Banco MySQL (crie antes rodando banco/estoque_veiculos.sql, que também cria este usuário)
# Se o seu MySQL não usa a porta 3306, troque o número abaixo.
spring.datasource.url=jdbc:mysql://localhost:3306/estoque_veiculos?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo
spring.datasource.username=estoque
spring.datasource.password=estoque123

# As tabelas vêm do script SQL; o Hibernate não cria nem altera nada
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
